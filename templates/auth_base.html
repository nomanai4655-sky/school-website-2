<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Educators (Soban Campus){% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page-wrapper">

<div class="auth-topbar">
    <a href="{{ url_for('home') }}" class="auth-logo-link">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="The Educators Logo" class="auth-logo-img">
        <span>The Educators</span>
    </a>
</div>

<div class="flash-messages">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<div class="auth-card-container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
