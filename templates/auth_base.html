<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Educators (Soban Campus){% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page-wrapper">

<div class="top-bar">
    <span>📞 0300-7331807</span>
    <span class="lang-toggle">
        <button id="lang-en-btn" onclick="setLanguage('en')">EN</button>
        <button id="lang-ur-btn" onclick="setLanguage('ur')">اردو</button>
    </span>
</div>

<div class="auth-topbar">
    <a href="{{ url_for('home') }}" class="auth-logo-link">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="The Educators Logo" class="auth-logo-img">
        <span>The Educators</span>
    </a>
</div>

{% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-overlay" id="flash-overlay">
        <div class="flash-box">
            {% for message in messages %}
                <p class="flash-text">{{ message }}</p>
            {% endfor %}
            <button class="flash-ok-btn" onclick="document.getElementById('flash-overlay').remove()">OK</button>
        </div>
    </div>
    {% endif %}
{% endwith %}

<div class="auth-card-container">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='js/language.js') }}"></script>

</body>
</html>
